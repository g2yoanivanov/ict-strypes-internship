{% extends 'base.html' %}
{% block title %} HOME PAGE {% endblock %}

{% block content %}
<div>
    <h1>THIS IS HOME PAGE</h1>

    <form method='POST'>
        {% csrf_token %}
        {% for field in form %}
            {{field.label}}
            {{field}}
            {{field.errors}}
        {% endfor %}

        <button type='submit'>
            SUBMIT
        </button>
    </form>
</div>
{% endblock %}
